name: R188 exact Boss restore launcher

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/r188-boss-restore-launcher.yml'

permissions:
  contents: write

jobs:
  restore-boss:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R188 work branch
        uses: actions/checkout@v4
        with:
          ref: r188-english-work
          fetch-depth: 0

      - name: Restore and validate exact Boss English file
        shell: bash
        run: |
          set -euo pipefail
          D='mavik-sklad/builds/R188-EN-WORKSPACE/large-files/boss'
          OUT='mavik-sklad/builds/R188-EN-STAGING/boss/index.php'
          TMP="$RUNNER_TEMP/boss-index-r188.php.gz"

          echo 'Actual stored part checksums:'
          sha256sum "$D"/boss-index-r188.php.gz.part-0{0,1,2,3,4,5}
          echo 'Stored part sizes:'
          stat -c '%s %n' "$D"/boss-index-r188.php.gz.part-0{0,1,2,3,4,5}

          cat "$D"/boss-index-r188.php.gz.part-0{0,1,2,3,4,5} > "$TMP"
          test "$(stat -c%s "$TMP")" = '55577'
          echo 'f940e8027dc018bf9f573cee6016e21a856d12c93b62003abd29fa388300ec22  '"$TMP" | sha256sum -c -
          gzip -t "$TMP"

          mkdir -p "$(dirname "$OUT")"
          gzip -dc "$TMP" > "$OUT"
          test "$(stat -c%s "$OUT")" = '234087'
          echo 'e9223e2820227c23adb8d716590e5bc4bd9ba12b926cba3bae30fd7d90b9d0d8  '"$OUT" | sha256sum -c -
          php -l "$OUT"

      - name: Commit restored exact file to work branch
        shell: bash
        run: |
          set -euo pipefail
          git add mavik-sklad/builds/R188-EN-STAGING/boss/index.php
          if git diff --cached --quiet; then
            echo 'Exact Boss file already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'R188: restore exact validated Boss English into STAGING'
          git pull --rebase origin r188-english-work
          git push origin HEAD:r188-english-work
