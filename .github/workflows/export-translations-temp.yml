name: Temporary translation export
on:
  push:
    paths:
      - '.github/workflows/export-translations-temp.yml'
      - 'mavik-sklad/translations/.export-trigger'
  pull_request:
    paths:
      - 'mavik-sklad/translations/.export-trigger'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare export
        run: |
          mkdir -p export
          cp -a mavik-sklad/translations/en export/en
      - name: Upload translation workspace
        uses: actions/upload-artifact@v4
        with:
          name: mavik-english-translations-export
          path: export/en
          if-no-files-found: error
          retention-days: 1
